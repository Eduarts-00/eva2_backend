<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página no encontrada - Farmacia B2B</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-color: #f8f9fa;
            text-align: center;
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .error-container {
            background: white;
            padding: 4rem;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            max-width: 600px;
            width: 90%;
        }
        .error-code {
            font-size: 6rem;
            font-weight: bold;
            color: #dc3545;
            margin-bottom: 0;
            line-height: 1;
        }
        .error-icon {
            font-size: 4rem;
            margin-bottom: 1rem;
        }
        .btn-home {
            background-color: #0d6efd;
            color: white;
            padding: 12px 30px;
            border-radius: 50px;
            font-weight: bold;
            text-decoration: none;
            transition: all 0.3s ease;
            display: inline-block;
            margin-top: 2rem;
        }
        .btn-home:hover {
            background-color: #0b5ed7;
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(13, 110, 253, 0.3);
            color: white;
        }
    </style>
</head>
<body>
    <div class="error-container">
        <div class="error-icon">💊📉</div>
        <h1 class="error-code">404</h1>
        <h2 class="mt-3 fw-bold">¡Ups! Ruta no encontrada</h2>
        <p class="text-muted mt-3 fs-5">Parece que te has perdido en la bodega. El recurso o la dirección que estás buscando no existe en nuestra API o no tienes los permisos necesarios.</p>
        <a href="/" class="btn-home">⬅️ Volver al Inicio Seguro</a>
    </div>
    
    <div style="position: absolute; bottom: 0; width: 100%; text-align: center; padding: 15px; background: #212529; color: white;">
        Desarrollo Backend: Edu | Sección: IEC-N4-C2 | Año: 2026
    </div>
</body>
</html>
